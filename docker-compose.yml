services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevFlowSqlPassword!123"
    ports:
      - "1433:1433"
    volumes:
      - devflow-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DevFlowSqlPassword!123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=DevFlowDb;User Id=sa;Password=DevFlowSqlPassword!123;TrustServerCertificate=True"
      JwtSettings__Secret: "DevFlowLocalDevelopmentSecretKey12345678901234567890"
      Cors__AllowedOrigins__0: "http://localhost:4200"
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  devflow-sql: